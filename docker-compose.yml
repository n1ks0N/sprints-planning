version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: sprints
      POSTGRES_USER: sprints
      POSTGRES_PASSWORD: sprints
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sprints -U sprints"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      SERVER_SERVLET_CONTEXT_PATH: /api/v1/sprints-planning
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/sprints?stringtype=unspecified
      SPRING_DATASOURCE_USERNAME: sprints
      SPRING_DATASOURCE_PASSWORD: sprints
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_JPA_PROPERTIES_HIBERNATE_JDBC_TIME_ZONE: UTC
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
