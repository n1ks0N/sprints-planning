spring:
  application:
    name: sprints-planning
  datasource:
    url: jdbc:postgresql://localhost:5432/sprints
    username: sprints
    password: sprints
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        globally_quoted_identifiers: true
    open-in-view: false
  jackson:
    serialization:
      write-dates-as-timestamps: false
  liquibase:
    enabled: true
    change-log: file:./database/changelog.yml
server:
  port: 8080
  servlet:
    context-path: /api/v1/sprints-planning
app:
  capacity:
    norm-factor: 0.75
    capacity-factor: 0.85
  jira:
    basic-token: ${APP_JIRA_BASIC_TOKEN:}
    mock-enabled: ${APP_JIRA_MOCK_ENABLED:false}
    connect-timeout-ms: ${APP_JIRA_CONNECT_TIMEOUT_MS:5000}
    read-timeout-ms: ${APP_JIRA_READ_TIMEOUT_MS:30000}
    export-worker-concurrency: ${APP_JIRA_EXPORT_WORKER_CONCURRENCY:1}
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
logging:
  level:
    org.apache.coyote.http11.Http11InputBuffer: off
